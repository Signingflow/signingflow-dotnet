name: SDK .NET

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        dotnet: ["8.0.x", "10.0.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Test
        run: |
          set -o pipefail
          dotnet test Signingflow.sln --nologo /p:CollectCoverage=true /p:Threshold=80 /p:ThresholdType=line%2Cbranch /p:ThresholdStat=total "/p:Include=[Signingflow]*" | tee test-out.txt
      - name: Save coverage percent
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.dotnet == '8.0.x'
        run: |
          python3 - << 'PY'
          import re
          import sys
          text = open("test-out.txt", encoding="utf-8", errors="replace").read()
          match = re.search(r"\|\s*Signingflow\s*\|\s*([0-9.]+)%", text)
          if not match:
              sys.exit("coverage summary was not found")
          open("coverage-percent.txt", "w").write(match.group(1))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.dotnet == '8.0.x'
        with:
          name: coverage-percent
          path: coverage-percent.txt
          retention-days: 1

  badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-percent
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/publish-coverage-badge.sh "$(cat coverage-percent.txt)"
